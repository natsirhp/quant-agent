name: Daily quant report

on:
  schedule:
    # Every day at 22:17 UTC (after the US close). Edit to taste: https://crontab.guru
    - cron: "17 22 * * *"
  workflow_dispatch: {}   # "Run workflow" button for a manual run

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run agent and send to Telegram
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python quant_agent.py daily
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quant-report
          path: out/
          if-no-files-found: ignore
